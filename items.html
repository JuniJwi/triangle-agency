<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ----------------------------------------------------------------- -->
  <!-- About Your Site                                                   -->
  <!-- ----------------------------------------------------------------- -->
  <link rel="shortcut icon" type="image/png" href="/triangle-agency/assets/favicon.png" />
  <title>Triangle Agency Items</title>
  <meta name="title" content="Triangle Agency Items" />
  <meta name="type" content="website" />
  <meta name="url" content="/" />
  <meta name="image" content="/triangle-agency/assets/meta.png" />
  <meta name="description" content="">

  <!-- No AI scraping directives -->
  <meta name="robots" content="noai">
  <meta name="robots" content="noimageai">


  <!-- ----------------------------------------------------------------- -->
  <!-- Styles                                                            -->
  <!-- ----------------------------------------------------------------- -->

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Multiselect CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@v1.14.0-beta2/dist/css/bootstrap-select.min.css">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">


  <!-- ----------------------------------------------------------------- -->
  <!-- Optional Styles                                                   -->
  <!-- ----------------------------------------------------------------- -->

  <!-- Custom CSS -->
  <link rel="stylesheet" type="text/css" href="/triangle-agency/styles/css/charadex.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body id="item-body" class="d-flex">
  <!-- ----------------------------------------------------------------- -->
  <!-- Header                                                            -->
  <!-- ----------------------------------------------------------------- -->
  <div class="load-html" id="header" data-source="/triangle-agency/includes/header.html"></div>
  <div class="loading text-primary"><i class="fa-solid fa-hourglass fa-spin fa-spin-reverse"></i></div>

  <!-- ----------------------------------------------------------------- -->
  <!-- Main Container                                                    -->
  <!-- ----------------------------------------------------------------- -->
  <div id="main-container" class="container d-flex order-md-2 order-3">
    <div id="item-gallery" class="w-100 d-flex flex-column softload">

      <!-- ----------------------------------------------------------------- -->
      <!-- UI                                                                -->
      <!-- ----------------------------------------------------------------- -->
      <div id="item-options" class="mx-md-3 mx-0 mb-2">

        <!-- Title -->
        <h1 class="text-center"><a href="/triangle-agency/items">Item Catalogue</a></h1>

        <!-- Faux Folders -->
        <div style="display:none;" id="item-folder-container">
          <div class="row mb-2" id="item-folders"></div>
          <!-- Button Items -->
          <div style="display:none;">
            <div class="col-md-4 col-6 p-1" id="item-folder">
              <a class="btn btn-dark d-block" href=""></a>
            </div>
          </div>
        </div>

        <!-- Filters -->
        <div style="display:none;" id="item-filter-container">
          <div class="row mb-2 gy-2" id="item-filters"></div>
          <!-- Filter Items -->
          <div style="display: none;">
            <div class="col-md-4 col-12" id="item-filter">
              <label class="px-2"></label>
              <select class="form-control" multiple data-actions-box="true" data-icon-base="fa-solid"
                data-tick-icon="fa-check"></select>
            </div>
          </div>
        </div>

        <!-- Search -->
        <div style="display:none;" id="item-search-container">
          <div class="row mb-2">
            <!-- Search Filter -->
            <div class="col-md-4 col-6" style="display: none;">
              <label class="px-2" for="item-search-filter">Search for</label>
              <select id="item-search-filter" class="form-control form-select" 
                aria-label="Select search parameter."></select>
            </div>
            <!-- Search Bar -->
            <div class="col">
              <label class="px-2" for="item-search">Search</label>
              <input class="form-control search" type="search" placeholder="Search" id="item-search">
            </div>
          </div>
        </div>

        <!-- ----------------------------------------------------------------- -->
        <!-- Pagination                                                        -->
        <!-- ----------------------------------------------------------------- -->
        <div style="display: none;" class="item-pagination-container">
          <nav class="d-flex justify-content-center align-items-center">
            <a class="btn-prev px-1"><i class="fa fa-chevron-left"></i></a>
            <ul class="pagination item-pagination item-pagination-top justify-content-center mb-0"></ul>
            <a class="btn-next px-1"><i class="fa fa-chevron-right"></i></a>
          </nav>
        </div>

        <!-- ----------------------------------------------------------------- -->
        <!-- Prev & Next Topbar                                                -->
        <!-- ----------------------------------------------------------------- -->
        <div style="display: none;" id="item-prevnext-container">
          <div class="row px-2 text-uppercase">
            <div class="col-6 px-1">
              <a id="entryPrev" href=""><i class="fas fa-chevron-left me-2"></i><b><span></span></b></a>
            </div>
            <div class="col-6 px-1 text-end order-md-1">
              <a id="entryNext" href=""><b><span></span></b><i class="fas fa-chevron-right ms-2"></i></a>
            </div>
          </div>
        </div>
      </div> <!-- end of ui -->

      <div id="item-card" class="card bg-body-tertiary flex-grow-1 mx-md-3 mx-0">
        <div class="card-body">
          <!-- ----------------------------------------------------------------- -->
          <!-- List Items Render Here                                            -->
          <!-- ----------------------------------------------------------------- -->
          <div class="row item-list list m-n2"></div>

          <!-- ----------------------------------------------------------------- -->
          <!-- Pagination                                                        -->
          <!-- ----------------------------------------------------------------- -->
          <div style="display: none;" class="item-pagination-container">
            <nav class="d-flex justify-content-center align-items-center">
              <a class="btn-prev px-1"><i class="fa fa-chevron-left"></i></a>
              <ul class="pagination item-pagination item-pagination-bottom justify-content-center mb-0"></ul>
              <a class="btn-next px-1"><i class="fa fa-chevron-right"></i></a>
            </nav>
          </div>
        </div>

      </div> <!-- end of item-card -->
    </div> <!-- End of item-gallery -->
  </div> <!-- End of main-container -->

  <!-- ----------------------------------------------------------------- -->
  <!-- Footer                                                            -->
  <!-- ----------------------------------------------------------------- -->
  <div class="load-html" id="footer" data-source="/triangle-agency/includes/footer.html"></div>

  <!-- ----------------------------------------------------------------- -->
  <!-- Repeat Items                                                      -->
  <!-- Do not remove 'display:none;'                                     -->
  <!-- ----------------------------------------------------------------- -->
  <div style="display:none;">
    <!-- ----------------------------------------------------------------- -->
    <!-- Gallery Items - Item Thumb                                        -->
    <!-- ----------------------------------------------------------------- -->
    <div class="col-md-4 col-6 p-2" id="item-gallery-item">
      <div class="card bg-body-tertiary h-100">
        <div class="card-header">
          <div class="row m-n1 px-3 align-items-center">
            <div class="col p-1">
              <h6 class="card-title mb-0">
                <a class="profileclass profileid profilelink" href="" target="_blank" data-cd-class="text"></a>
              </h6>
            </div>
            <div class="col-auto p-1">
              <button class="btn infoclass infopopovertitle infopopovercontent" data-cd-class="btn-outline"
                      type="button" aria-label="Relationship information."
                      data-bs-toggle="popover" data-bs-placement="top" data-bs-html="true"
                      data-bs-title="" data-bs-content="">
                <i class="fa-solid fa-circle-question"></i>
              </button>
            </div>
          </div>
        </div>
        <!-- Description -->
        <div class="card-body d-flex flex-column flex-fill justify-content-center">
          <p class="description"></p>
          <div class="d-grid gap-2 mt-auto">
            <button class="btn action actionclass actionpopovertitle actionpopovercontent"
                    data-cd-class="btn" type="button"
                    data-bs-toggle="popover" data-bs-placement="top" data-bs-html="true"
                    data-bs-title="" data-bs-content="">
              <strong class="action"></strong>
            </button>
          </div>
        </div>
        <!-- Quantity -->
        <div class="card-footer text-muted text-center small">
          <span class="source"></span>
        </div>
      </div>
    </div> <!-- End of Item Thumb -->

    <!-- ----------------------------------------------------------------- -->
    <!-- Gallery Profile - Item Card                                       -->
    <!-- ----------------------------------------------------------------- -->
    <div class="col-12 item-body" id="item-profile">

      <!-- Hero Image -->
      <div class="cd-hero-title m-1">
        <!-- Header -->
        <div class="profileid m-auto"></div>
      </div>

      <!-- --------- -->
      <!-- Main Info -->
      <!-- --------- -->
      <hr>
        <h2 class="text-center">Basics</h2>
      <hr>

      <div class="row mt-4 mx-1 justify-content-center align-items-center">

        <!-- Image -->
        <div class="col-md-4 d-flex text-center">
          <img class="img-thumbnail img-fluid image" src="" alt="Item image.">
        </div>

        <!-- Info -->
        <div class="col-md-8">

          <div class="row align-items-center mb-2">
            <div class="col-4 ps-0 text-end text-truncate span-header">
              Item
            </div>
            <div class="col-8 text-center card">
              <span class="item"></span>
            </div>
          </div>
          
          <div class="row align-items-center mb-2">
            <div class="col-4 ps-0 text-end text-truncate span-header">
              Type
            </div>
            <div class="col-8 text-center card">
              <span class="type"></span>
            </div>
          </div>
          
          <div class="row align-items-center mb-2">
            <div class="col-4 ps-0 text-end text-truncate span-header">
              Value
            </div>
            <div class="col-8 text-center card">
              <span class="value"></span>
            </div>
          </div>

        </div>
      </div>


      <!-- Description -->
      <hr>
      <h2 class="text-center">Description</h2>
      <hr>
      <blockquote class="description"></blockquote>

    </div> <!-- End of Item Card -->

  </div> <!-- End of Repeat Items -->

  <!-- ----------------------------------------------------------------- -->
  <!-- JS                                                                -->
  <!-- ----------------------------------------------------------------- -->

  <!-- JQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
    crossorigin="anonymous"></script>

  <!-- Showdown.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- Bootstrap Multiselect -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@v1.14.0-beta2/dist/js/bootstrap-select.min.js"></script>

  <!-- Charadex Script -->
  <script src="/triangle-agency/styles/js/pages/base.js" type="module"></script>
  <script src="/triangle-agency/styles/js/pages/items.js" type="module"></script>


</body>

</html>
