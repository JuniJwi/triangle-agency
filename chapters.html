<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ----------------------------------------------------------------- -->
  <!-- About Your Site                                                   -->
  <!-- ----------------------------------------------------------------- -->
  <link rel="shortcut icon" type="image/png" href="/triangle-agency/assets/favicon.png" />
  <title>Charadex Chapters</title>
  <meta name="title" content="Charadex Chapters" />
  <meta name="type" content="website" />
  <meta name="url" content="/" />
  <meta name="image" content="/triangle-agency/assets/meta.png" />
  <meta name="description" content="" />

  <!-- No AI scraping directives -->
  <meta name="robots" content="noai" />
  <meta name="robots" content="noimageai" />

  <!-- ----------------------------------------------------------------- -->
  <!-- Styles                                                            -->
  <!-- ----------------------------------------------------------------- -->

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

  <!-- Multiselect CSS -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-select@v1.14.0-beta2/dist/css/bootstrap-select.min.css" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />

  <!-- ----------------------------------------------------------------- -->
  <!-- Optional Styles                                                   -->
  <!-- ----------------------------------------------------------------- -->

  <!-- Custom CSS -->
  <link rel="stylesheet" type="text/css" href="/triangle-agency/styles/css/charadex.css" />

  <!-- Google Font -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Domine:wght@400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Permanent+Marker&display=swap" rel="stylesheet">
</head>

<body id="charadex-body" class="d-flex">
  <!-- ----------------------------------------------------------------- -->
  <!-- Header                                                            -->
  <!-- ----------------------------------------------------------------- -->
  <div class="load-html" data-source="/triangle-agency/includes/header.html"></div>
  <div class="loading text-primary"><i class="fa-solid fa-hourglass fa-spin fa-spin-reverse"></i></div>

  <!-- ----------------------------------------------------------------- -->
  <!-- Main Container                                                    -->
  <!-- ----------------------------------------------------------------- -->
  <div id="main-container" class="container d-flex order-md-2 order-3">
    <div id="charadex-gallery" class="w-100 d-flex flex-column softload">

      <!-- ----------------------------------------------------------------- -->
      <!-- UI                                                                -->
      <!-- ----------------------------------------------------------------- -->
      <div id="search-options" class="mx-md-3 mx-0 mb-2">

        <!-- Title -->
        <h1 class="text-center"><a href="/triangle-agency/chapters">Chapters</a></h1>

        <!-- Faux Folders -->
        <div style="display:none;" id="charadex-folder-container">
          <div class="row mb-2" id="charadex-folders"></div>
          <!-- Button Items -->
          <div style="display:none;">
            <div class="col-md-4 col-6 p-1" id="charadex-folder">
              <a class="btn btn-primary d-block" href=""></a>
            </div>
          </div>
        </div>

        <!-- Filters -->
        <div style="display:none;" id="charadex-filter-container">
          <div class="row mb-2 gy-2" id="charadex-filters"></div>
          <!-- Filter Items -->
          <div style="display: none;">
            <div class="col-md-6 col-12" id="charadex-filter">
              <label class="px-2"></label>
              <select class="form-control" multiple data-actions-box="true" data-icon-base="fa-solid"
                data-tick-icon="fa-check"></select>
            </div>
          </div>
        </div>

        <!-- Search -->
        <div style="display:none;" id="charadex-search-container">
          <div class="row mb-2">
            <!-- Search Filter -->
            <div class="col-md-4 col-6" style="display: none;">
              <label class="px-2" for="charadex-search-filter">Search for</label>
              <select id="charadex-search-filter" class="form-control form-select"
                aria-label="Select search parameter."></select>
            </div>
            <!-- Search Bar -->
            <div class="col">
              <label class="px-2" for="charadex-search">Search</label>
              <input class="form-control search" type="search" placeholder="Search" id="charadex-search">
            </div>
          </div>
        </div>

        <!-- ----------------------------------------------------------------- -->
        <!-- Pagination                                                        -->
        <!-- ----------------------------------------------------------------- -->
        <div style="display: none;" class="charadex-pagination-container">
          <nav class="d-flex justify-content-center align-items-center">
            <a class="btn-prev px-1"><i class="fa fa-chevron-left"></i></a>
            <ul class="pagination charadex-pagination charadex-pagination-top justify-content-center mb-0"></ul>
            <a class="btn-next px-1"><i class="fa fa-chevron-right"></i></a>
          </nav>
        </div>

        <!-- ----------------------------------------------------------------- -->
        <!-- Prev & Next Topbar                                                -->
        <!-- ----------------------------------------------------------------- -->
        <div style="display: none;" id="charadex-prevnext-container">
          <div class="row px-2 text-uppercase">
            <div class="col-6 px-1">
              <a id="entryPrev" href=""><i class="fas fa-chevron-left me-2"></i><b><span></span></b></a>
            </div>
            <div class="col-6 px-1 text-end order-md-1">
              <a id="entryNext" href=""><b><span></span></b><i class="fas fa-chevron-right ms-2"></i></a>
            </div>
          </div>
        </div>
      </div> <!-- end of ui -->

      <div id="gallery-card" class="card bg-body-tertiary flex-grow-1 mx-md-3 mx-0">
        <div class="card-body">
          <!-- ----------------------------------------------------------------- -->
          <!-- List Items Render Here                                            -->
          <!-- ----------------------------------------------------------------- -->
          <div class="charadex-list list"></div>
          
          <!-- ----------------------------------------------------------------- -->
          <!-- Pagination                                                        -->
          <!-- ----------------------------------------------------------------- -->
          <div style="display: none;" class="charadex-pagination-container">
            <nav class="d-flex justify-content-center align-items-center">
              <a class="btn-prev px-1"><i class="fa fa-chevron-left"></i></a>
              <ul class="pagination charadex-pagination charadex-pagination-bottom justify-content-center mb-0"></ul>
              <a class="btn-next px-1"><i class="fa fa-chevron-right"></i></a>
            </nav>
          </div>
        </div>

      </div> <!-- End of gallery-card -->
    </div> <!-- End of charadex-gallery -->
  </div> <!-- End of main-container -->

  <!-- ----------------------------------------------------------------- -->
  <!-- Footer                                                            -->
  <!-- ----------------------------------------------------------------- -->
  <div class="load-html" data-source="/triangle-agency/includes/footer.html"></div>

  <!-- ----------------------------------------------------------------- -->
  <!-- Repeat Items                                                      -->
  <!-- Do not remove 'display:none;'                                     -->
  <!-- ----------------------------------------------------------------- -->
  <div style="display: none">
    <!-- ----------------------------------------------------------------- -->
    <!-- Gallery Items - Chapter Thumb                                     -->
    <!-- ----------------------------------------------------------------- -->
    <div class="col-md-6 p-2" id="charadex-gallery-item">
      <div class="card bg-body-tertiary h-100">
        <div class="card-header text-center d-flex">
          <div class="m-auto z-1">
            <a class="stretched-link profileid profilelink" href=""></a>
          </div>
        </div>
        <div class="card-body d-flex flex-column flex-fill">
          <div class="summary mb-auto"></div>
        </div>
        <div class="card-footer text-muted">
          <div class="row m-n1 px-3">
            <div class="col p-1 characters"></div>
            <div class="col p-1 categorybadge"></div>
          </div>
        </div>
      </div>
    </div> <!-- End of Chapter Thumb -->

    <!-- ----------------------------------------------------------------- -->
    <!-- Gallery Profile - Chapter Card                                    -->
    <!-- ----------------------------------------------------------------- -->
    <div class="col-12" id="charadex-profile">

      <!-- Hero Image -->
      <div class="cd-hero-title m-1 cd-prompt-background">
        <!-- Header -->
        <div class="profileid m-auto"></div>
      </div>

      <!-- Body -->
      <div class="container my-4">
        <div class="card card-body d-flex flex-column p-4" id="background">
          <img src="" id="sprite">
          <div class="card">
            <div class="card-header">
              <h5 class="card-title" id="speaker"></h5>
            </div>
            <div class="card-body" id="speech"></div>
          </div>
        </div>
      </div>

      <!-- Buttons -->
      <div class="d-flex justify-content-between">
        <a class="btn btn-primary link" href="" role="button" id="prev-button">
          Prev<i class="fas fa-circle-chevron-left fa-fw ms-2"></i>
        </a>
        <a class="btn btn-primary link" href="" role="button" id="next-button">
          Next<i class="fas fa-circle-chevron-right fa-fw ms-2"></i>
        </a>
      </div>

    </div> <!-- End of Chapter Card -->

  </div> <!-- End of Repeat Items -->

  <!-- ----------------------------------------------------------------- -->
  <!-- JS                                                                -->
  <!-- ----------------------------------------------------------------- -->

  <!-- JQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
    crossorigin="anonymous"></script>

  <!-- Showdown.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <!-- Bootstrap Multiselect -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@v1.14.0-beta2/dist/js/bootstrap-select.min.js"></script>

  <!-- Charadex Script -->
  <script src="/triangle-agency/styles/js/pages/base.js" type="module"></script>
  <script src="/triangle-agency/styles/js/pages/chapters.js" type="module"></script>
</body>

</html>
